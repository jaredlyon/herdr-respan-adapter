name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable with Clippy
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Build
        run: cargo +stable build --locked
      - name: Test
        run: cargo +stable test --locked
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
  assets:
    # In-process adapter assets (TS/JS/Python) have their own stdlib-only checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun test src/agents/pi/extension.test.ts
      - run: bun src/agents/omp/assets/check.ts
      - run: node src/agents/opencode/assets/test.mjs
      - run: node src/proxy/provider.test.mjs
      - run: python3 -m unittest discover -s src/agents/hermes -p "test_*.py"
