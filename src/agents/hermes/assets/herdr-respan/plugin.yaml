name: herdr-respan
version: "0.1.0"
description: Trace interactive Hermes turns in herdr through the shared Respan bridge
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - pre_auxiliary_call
  - post_auxiliary_call
